<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Резервация потвърдена</title>
</head>
<body>
<h2>Здравей, <span th:text="${name}">User</span>!</h2>
<p>Резервацията ви за <strong th:text="${reservationDate}"></strong> е потвърдена.</p>
<p>Номер на резервацията: <span th:text="${reservationId}"></span></p>
<p>Благодарим ви!</p>
</body>
</html>
