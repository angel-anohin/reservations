<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>AI Резервации</title>
<style>
body { font-family: Arial; max-width: 600px; margin: 40px auto; }
#chat { border: 1px solid #ccc; height: 320px; padding: 10px; overflow-y: auto; }
input { width: 80%; padding: 6px; }
button { padding: 6px 10px; }
</style>
</head>
<body>

<h2>AI Асистент за резервации</h2>

<div id="chat"></div><br>

<input id="msg" placeholder="Напиши съобщение...">
<button onclick="send()">Изпрати</button>

<script>
async function send() {
    const input = document.getElementById("msg");
    const text = input.value;
    if (!text) return;

    input.value = "";
    add("Ти", text);

    const res = await fetch("http://127.0.0.1:5000/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({message: text})
    });

    const data = await res.json();
    add("Бот", data.reply);
}

function add(sender, text) {
    const chat = document.getElementById("chat");
    chat.innerHTML += `<b>${sender}:</b> ${text}<br>`;
    chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
